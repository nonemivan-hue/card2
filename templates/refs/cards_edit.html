{% extends "base.html" %}
{% block title %}Редактирование карты{% endblock %}
{% block page_title %}Редактирование карты{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-white">
        <strong>Карта: {{ card.card_number }}</strong>
    </div>
    <div class="card-body">
        <form method="POST" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Вид карты</label>
                <select name="card_type_id" class="form-select" required>
                    <option value="">-- выберите --</option>
                    {% for ct in card_types %}
                    <option value="{{ ct.id }}" {% if card.card_type_id == ct.id %}selected{% endif %}>{{ ct.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Статус</label>
                <select name="status" class="form-select">
                    <option value="">-- не указан --</option>
                    <option value="ready_to_print" {% if card.status == 'ready_to_print' %}selected{% endif %}>Готова к печати</option>
                    <option value="ready_to_issue" {% if card.status == 'ready_to_issue' %}selected{% endif %}>Готова к выдаче</option>
                    <option value="issued" {% if card.status == 'issued' %}selected{% endif %}>Выдана</option>
                    <option value="defect" {% if card.status == 'defect' %}selected{% endif %}>Брак</option>
                    <option value="transferred_region" {% if card.status == 'transferred_region' %}selected{% endif %}>Передана в другой регион</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">ФИО владельца</label>
                <select name="owner_id" class="form-select">
                    <option value="">-- не указан --</option>
                    {% for owner in owners %}
                    <option value="{{ owner.id }}" {% if card.owner_id == owner.id %}selected{% endif %}>{{ owner.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">ФИО заявителя</label>
                <select name="applicant_id" class="form-select">
                    <option value="">-- не указан --</option>
                    {% for applicant in applicants %}
                    <option value="{{ applicant.id }}" {% if card.applicant_id == applicant.id %}selected{% endif %}>{{ applicant.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                <a href="{{ url_for('ref_cards') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Назад</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
