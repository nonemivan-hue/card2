{% extends "base.html" %}
{% block title %}Редактирование МФЦ - Учет транспортных карт{% endblock %}
{% block page_title %}Редактирование МФЦ{% endblock %}

{% block content %}
<div class="card mb-3">
    <div class="card-header bg-white">
        <h5 class="m-0"><i class="bi bi-building"></i> {{ mfc.name }}</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Код</label>
                    <input type="text" name="code" class="form-control" value="{{ mfc.code }}" required>
                </div>
                <div class="col-md-8">
                    <label class="form-label">Наименование</label>
                    <input type="text" name="name" class="form-control" value="{{ mfc.name }}" required>
                </div>
            </div>
            
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> Сохранить изменения
                </button>
                <a href="{{ url_for('ref_mfcs') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
